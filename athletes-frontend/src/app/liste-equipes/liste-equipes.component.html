<div class="container mt-4">
  <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
    <app-update-equipe
      [equipe]="updatedEquipe"
      (equipeUpdated)="equipeUpdated($event)"
      [ajout]="ajout">
    </app-update-equipe>
  </div>

  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Id</th>
            <th>Nom Équipe</th>
            <th>Action</th>
          </tr>
        </thead>
        @for (eq of equipes; track eq.codeEquipe) {
          <tbody>
            <tr>
              <td>{{eq.codeEquipe}}</td>
              <td>{{eq.nomEquipe}}</td>
              <td>
                <a class="btn btn-success" (click)="updateEq(eq)">Editer</a>
              </td>
            </tr>
          </tbody>
        }
      </table>
    </div>
  </div>
</div>
